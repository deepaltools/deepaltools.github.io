<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deepal Tools</title>
<meta name="description" content="Бесплатные приложения для Deepal. Канал с новостями и обновлениями, поддержать проект — через Tribute или Boosty.">
<meta name="theme-color" content="#021458">
<meta property="og:title" content="Deepal Tools">
<meta property="og:description" content="Канал с новостями и обновлениями. Поддержать проект — через Tribute или Boosty.">
<meta property="og:image" content="https://deepaltools.github.io/assets/deepal-tools.png">
<link rel="icon" href="assets/deepal-tools.png">
<link rel="apple-touch-icon" href="assets/deepal-tools.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Цвета взяты со значка Deepal Tools: его фон и свечение контура. */
    --navy: #021458;
    --navy-deep: #010C38;
    --glow: #00E5FF;
    --white: #F3F7FF;
    --mist: #A9B8E8;
    /* Фирменные цвета сервисов — с их собственных значков. */
    --telegram: #2AABEE;
    --telegram-deep: #1C8FD0;
    --tribute: #3399FF;
    --tribute-deep: #1E7FE6;
    --boosty: #F15F2C;
    --boosty-deep: #D94A1A;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    background:
      radial-gradient(120% 70% at 50% 0%, var(--navy) 0%, var(--navy) 45%, var(--navy-deep) 100%);
    background-color: var(--navy-deep);
    color: var(--white);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    /* Содержимое — по центру экрана, подпись снизу тянет его чуть выше середины. */
    justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
  }

  main {
    width: 100%;
    max-width: 1000px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  /* Значок целиком, без обрезки. Размер зависит и от ширины, и от высоты окна, чтобы
     на низком экране плитки помещались целиком. height: auto обязателен — иначе атрибут
     height у картинки задаёт высоту отдельно от ширины и значок сплющивается.
     Отрицательные поля съедают пустой фон вокруг треугольника. */
  .mark {
    --s: clamp(130px, min(44vw, 30vh), 270px);
    width: var(--s);
    height: auto;
    aspect-ratio: 1 / 1;
    margin: calc(var(--s) * -0.2) 0 calc(var(--s) * -0.14);
    display: block;
    -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 52%, transparent 71%);
            mask-image: radial-gradient(circle at 50% 50%, #000 52%, transparent 71%);
    animation: wake 1.6s cubic-bezier(.2,.7,.2,1) both;
  }

  @keyframes wake {
    0%   { opacity: 0; transform: scale(.94); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* Фон картинки значка заходит под заголовок; текст — поверх него, иначе ложится тенью. */
  h1, .lede, .choices { position: relative; z-index: 1; }

  h1 {
    font-family: "Unbounded", "Inter", sans-serif;
    font-weight: 700;
    font-size: clamp(30px, min(8vw, 7vh), 56px);
    line-height: 1.08;
    letter-spacing: -0.01em;
    margin: 4px 0 0;
  }

  .lede {
    margin: 14px 0 0;
    max-width: 32em;
    font-size: clamp(16px, 4.2vw, 19px);
    line-height: 1.55;
    color: var(--mist);
  }

  /* Три равные плитки: канал и два способа поддержать. */
  .choices {
    width: 100%;
    margin-top: clamp(20px, 4vh, 40px);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }

  .pay {
    position: relative;
    display: flex;
    flex-direction: column;
    text-align: left;
    gap: clamp(14px, 2.4vh, 20px);
    padding: clamp(20px, 3.4vh, 28px);
    border-radius: 28px;
    color: #fff;
    text-decoration: none;
    overflow: hidden;
    transition: transform .18s ease, box-shadow .18s ease;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }

  .pay:active { transform: scale(.98); }
  .pay:focus-visible { outline: 3px solid var(--glow); outline-offset: 4px; }

  .pay.telegram {
    background: linear-gradient(160deg, var(--telegram) 0%, var(--telegram-deep) 100%);
    box-shadow: 0 18px 40px -18px rgba(42, 171, 238, .75);
  }

  .pay.tribute {
    background: linear-gradient(160deg, var(--tribute) 0%, var(--tribute-deep) 100%);
    box-shadow: 0 18px 40px -18px rgba(51, 153, 255, .75);
  }

  .pay.boosty {
    background: linear-gradient(160deg, var(--boosty) 0%, var(--boosty-deep) 100%);
    box-shadow: 0 18px 40px -18px rgba(241, 95, 44, .75);
  }

  @media (hover: hover) {
    .pay:hover { transform: translateY(-3px); }
  }

  /* Значок сервиса и название с подписью — в одну строку. */
  .head {
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }

  .badge {
    width: 64px;
    height: 64px;
    border-radius: 18px;
    background: #fff;
    display: grid;
    place-items: center;
    flex: none;
  }

  .badge img { width: 46px; height: 46px; display: block; }
  .badge svg { width: 38px; height: 38px; display: block; }
  .badge svg.tg { width: 46px; height: 46px; }

  .text { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

  .name {
    font-weight: 700;
    font-size: 26px;
    line-height: 1.1;
    letter-spacing: -0.02em;
  }

  .how {
    font-size: 15px;
    line-height: 1.4;
    color: rgba(255, 255, 255, .88);
  }

  /* Кнопки — внизу плитки, во всю её ширину, чтобы у всех трёх стояли на одном уровне. */
  .gos {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .go {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 12px 18px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .22);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    white-space: nowrap;
    transition: background .18s ease;
  }

  .go.ghost { background: transparent; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .55); }
  a.go:focus-visible { outline: 3px solid var(--glow); outline-offset: 3px; }

  @media (hover: hover) {
    a.go:hover { background: rgba(255, 255, 255, .34); }
  }

  /* Плитка Tribute нажимается целиком и ведёт в Telegram: невидимый слой ссылки
     «Открыть в Telegram» растянут на всю плитку. Веб-версия лежит выше этого слоя
     и открывается только своей кнопкой. */
  .go.main::after { content: ""; position: absolute; inset: 0; border-radius: 28px; }
  .go.ghost { position: relative; z-index: 1; }

  footer {
    padding-top: clamp(20px, 4vh, 40px);
    text-align: center;
    font-size: 15px;
    line-height: 1.6;
    color: var(--mist);
  }

  /* Уже трёх колонок — плитки друг под другом. */
  @media (max-width: 860px) {
    .choices { grid-template-columns: 1fr; max-width: 480px; gap: 12px; }
    .pay { padding: 20px; gap: 14px; }
    .name { font-size: 24px; }
  }

  @media (max-width: 600px) {
    h1 { font-size: 34px; }
    .lede { font-size: 16px; margin-top: 10px; }
    .choices { margin-top: 18px; }
    /* На телефоне плитки широкие — две кнопки Tribute помещаются в одну строку. */
    .tribute .gos { flex-direction: row; }
    .tribute .go { flex: 1 1 auto; padding-inline: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .mark { animation: none; }
    .pay, .go { transition: none; }
  }
</style>
</head>
<body>
<main>
  <img class="mark" src="assets/deepal-tools.png" alt="Deepal Tools" width="300" height="300">

  <h1>Deepal&nbsp;Tools</h1>
  <p class="lede">Бесплатные приложения для Deepal</p>

  <div class="choices">
    <a class="pay telegram" href="https://t.me/deepal_tools" rel="noopener">
      <span class="head">
        <span class="badge">
          <!-- Знак Telegram — фирменный, из Simple Icons. -->
          <svg class="tg" viewBox="0 0 24 24" aria-hidden="true"><path fill="#26A5E4" d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
        </span>
        <span class="text">
          <span class="name">Канал</span>
          <span class="how">@deepal_tools — новости и обновления</span>
        </span>
      </span>
      <span class="gos"><span class="go">Открыть канал</span></span>
    </a>

    <!-- У Tribute два входа: мини-приложение в Telegram и веб-версия в браузере. -->
    <div class="pay tribute">
      <span class="head">
        <span class="badge"><img src="assets/tribute.png" alt="" width="46" height="46"></span>
        <span class="text">
          <span class="name">Tribute</span>
          <span class="how">Поддержать в Telegram или в браузере</span>
        </span>
      </span>
      <span class="gos">
        <a class="go main" href="https://t.me/tribute/app?startapp=dPI5" rel="noopener">Открыть в Telegram</a>
        <a class="go ghost" href="https://web.tribute.tg/d/PI5" rel="noopener">Веб-версия</a>
      </span>
    </div>

    <a class="pay boosty" href="https://boosty.to/deepaltools/donate" rel="noopener">
      <span class="head">
        <span class="badge">
          <!-- Знак Boosty — фирменный, из Simple Icons (источник: boosty.to/app/brand). -->
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#F15F2C" d="M2.661 14.337 6.801 0h6.362L11.88 4.444l-.038.077-3.378 11.733h3.15c-1.321 3.289-2.35 5.867-3.086 7.733-5.816-.063-7.442-4.228-6.02-9.155M8.554 24l7.67-11.035h-3.25l2.83-7.073c4.852.508 7.137 4.33 5.791 8.952C20.16 19.81 14.344 24 8.68 24h-.127z"/></svg>
        </span>
        <span class="text">
          <span class="name">Boosty</span>
          <span class="how">Поддержать картой, если Tribute не открывается</span>
        </span>
      </span>
      <span class="gos"><span class="go">Поддержать через Boosty</span></span>
    </a>
  </div>
</main>

<footer>Спасибо, что вы с нами.</footer>
</body>
</html>
